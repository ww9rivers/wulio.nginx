server {
	server_name	base.9rivers.com;

	listen 8758 ssl;
	ssl_certificate /etc/letsencrypt/live/base.9rivers.com/cert.pem;
	ssl_certificate_key /etc/letsencrypt/live/base.9rivers.com/privkey.pem;

	location / {
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto http;
		proxy_set_header X-NginX-Proxy true;
		proxy_set_header Host $http_host:$server_port;
		proxy_pass https://192.168.8.51:8000;
		proxy_cookie_domain base.9rivers.com $host;
		proxy_ssl_session_reuse on;
		proxy_cache_bypass $http_upgrade;
		proxy_redirect off;
	}
}
